<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="title desc">
<title id="title">新 worker 收到的上下文</title>
<desc id="desc">两个 worker 并行做报名页和确认邮件。主 agent 核对可复用的邮箱输入框，在主会话里就邮件预览的时间向用户提问，记下用户定的上海时区约定。一周后，候补页的 worker 收到两条用户约定和一条已审查的发现。</desc>
<rect width="360" height="800" rx="14" fill="#f7f5e9"/><g font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<text x="16" y="29" font-size="14" font-weight="700" fill="#385d3d">周一 · 你在主会话里</text>
<text x="16" y="57" font-size="18" font-weight="700" fill="#242822">“这个项目的活动报名都只收邮箱。</text>
<text x="16" y="81" font-size="18" font-weight="700" fill="#242822">帮我做报名页，再做一封</text>
<text x="16" y="105" font-size="18" font-weight="700" fill="#242822">报名确认邮件。”</text>
<text x="16" y="144" font-size="16" font-weight="700" fill="#385d3d">主 agent 同时派出两个 worker</text>
<path d="M22 155v166q0 7 7 7h7M22 198h14" fill="none" stroke="#385d3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="36" y="162" width="310" height="121" rx="8" fill="#e3edcf" stroke="none"/>
<rect x="36" y="294" width="310" height="121" rx="8" fill="#ede7f6" stroke="none"/>
<g transform="translate(48 175)">
<rect x="0" y="0" width="30" height="24" rx="3" fill="#f7f5e9" stroke="#385d3d"/>
<path d="M1 7h28M6 13h18M6 18h8" fill="none" stroke="#385d3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(48 306)">
<rect x="0" y="2" width="30" height="20" rx="3" fill="#f7f5e9" stroke="#674995"/>
<path d="m1 4 14 10 14-10" fill="none" stroke="#674995" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="86" y="194" font-size="17" font-weight="700" fill="#385d3d">Worker A · 报名页</text>
<text x="86" y="325" font-size="17" font-weight="700" fill="#674995">Worker B · 确认邮件</text>
<text x="48" y="224" font-size="15" font-weight="400" fill="#242822">补丁复用了项目已有的邮箱输入框。</text>
<text x="48" y="248" font-size="15" font-weight="400" fill="#4b554b">主 agent 核对了校验测试，</text>
<text x="48" y="268" font-size="15" font-weight="400" fill="#4b554b">记下可复用的输入框。</text>
<text x="48" y="355" font-size="15" font-weight="400" fill="#242822">预览上写着「19:00」。worker 请你</text>
<text x="48" y="377" font-size="15" font-weight="400" fill="#242822">确认邮件里该标哪个时区。</text>
<text x="48" y="400" font-size="15" font-weight="400" fill="#4b554b">同步后，主 agent 在原对话里问你。</text>
<text x="16" y="452" font-size="19" font-weight="700" fill="#242822">“用上海时间。以后活动页面和邮件</text>
<text x="16" y="478" font-size="19" font-weight="700" fill="#242822">都写明是上海时间。”</text>
<text x="16" y="510" font-size="15" font-weight="400" fill="#4b554b">主 agent 记下项目约定，把答复带回邮件任务。</text>
<text x="16" y="532" font-size="15" font-weight="400" fill="#4b554b">下一版邮件预览写着</text>
<text x="16" y="554" font-size="15" font-weight="400" fill="#4b554b">「19:00（上海时间）」。</text>
<path d="M16 574H344" fill="none" stroke="#c3c8b7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="605" font-size="14" font-weight="700" fill="#385d3d">一周后 · 同一项目的新对话</text>
<text x="16" y="641" font-size="23" font-weight="700" fill="#242822">“加个候补报名页。”</text>
<text x="16" y="679" font-size="16" font-weight="700" fill="#674995">新 worker 收到的任务说明</text>
<text x="16" y="708" font-size="16" font-weight="400" fill="#242822">做候补报名页，复用现有的邮箱输入框。</text>
<text x="16" y="732" font-size="16" font-weight="400" fill="#242822">只收邮箱。活动时间换算为上海时间，</text>
<text x="16" y="756" font-size="16" font-weight="400" fill="#242822">并在时间旁标明「上海时间」。</text>
</g>
</svg>
