    <text x="446" y="180" font-size="16" font-weight="400" fill="#c6cad7" text-anchor="start">The Host keeps running if you disconnect.</text>
    <text x="83" y="211" font-size="19" font-weight="700" fill="#d4baff" text-anchor="start">Approval request and decision</text>
    <path d="M65 225H648" fill="none" stroke="#d4baff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
    <path d="M70 220l-5 5 5 5" fill="none" stroke="#d4baff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M643 220l5 5-5 5" fill="none" stroke="#d4baff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
