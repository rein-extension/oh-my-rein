    <text x="421" y="77" font-size="19" font-weight="700" fill="#f3f0e4" text-anchor="middle">Remote Host</text>
    <text x="648" y="77" font-size="19" font-weight="700" fill="#f3f0e4" text-anchor="middle">Worker A</text>
    <text x="804" y="77" font-size="19" font-weight="700" fill="#f3f0e4" text-anchor="middle">Worker B</text>
