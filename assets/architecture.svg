    <text x="83" y="296" font-size="16" font-weight="400" fill="#c6cad7" text-anchor="start">Collect each run’s report and patch.</text>
    <text x="446" y="278" font-size="16" font-weight="400" fill="#c6cad7" text-anchor="start">Follow up in the same worker session.</text>
